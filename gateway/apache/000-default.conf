<VirtualHost *:80>
  ServerName localhost
  DocumentRoot /var/www/html

  # Ensure we can proxy to our backend services
  ProxyPreserveHost On
  ProxyPass        /api/auth/    http://auth-service/
  ProxyPassReverse /api/auth/    http://auth-service/

  ProxyPass        /api/catalog/ http://catalog-service/
  ProxyPassReverse /api/catalog/ http://catalog-service/

  <Directory /var/www/html>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
  </Directory>

  # Simple SPA-ish support (optional): rewrite unknown routes to /
  RewriteEngine On
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteCond %{REQUEST_FILENAME} !-d
  RewriteRule ^/?$ /index.html [L]

  # CORS for API (same-origin in this example, but handy if you split origins)
  Header always set Access-Control-Allow-Origin "*"
  Header always set Access-Control-Allow-Headers "Content-Type, Authorization"
  Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
</VirtualHost>
