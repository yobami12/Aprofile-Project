services:
  db:
    image: mariadb:11
    container_name: db
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - appnet

  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
    depends_on:
      - db
    networks:
      - appnet

  catalog-service:
    build: ./catalog-service
    container_name: catalog-service
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
    depends_on:
      - db
    networks:
      - appnet

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "${HOST_HTTP_PORT}:80"
    depends_on:
      - auth-service
      - catalog-service
    networks:
      - appnet

volumes:
  db_data:

networks:
  appnet:
